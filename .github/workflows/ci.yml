name: CI
# Reference: https://docs.github.com/en/actions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint markdown documentation
        run: npm run lint:md

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test

      - name: Create E2E local secrets file
        run: printf 'ADMIN_SECRET=ci-e2e-admin-secret\n' > .dev.vars

      - name: Apply local D1 migrations for E2E
        run: npx wrangler d1 migrations apply invoice-rescue-db --local

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E test suite
        run: npm run e2e

      - name: Verify Cloudflare Worker bundling
        run: npx wrangler deploy --dry-run
