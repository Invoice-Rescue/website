name: Security & Vulnerability Scan
# Reference: https://docs.github.com/en/code-security

on:
  schedule:
    # Run every Monday at 07:00 UTC (after Dependabot creates PRs at 06:00)
    - cron: "0 7 * * 1"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit check
        run: npm run deps:audit
