name: Security & Vulnerability Scan
# Reference: https://docs.github.com/en/code-security

on:
  schedule:
    # Run every Monday at 07:00 UTC (after Dependabot creates PRs at 06:00)
    - cron: "0 7 * * 1"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Gate on shipped (production) dependencies only; the Worker has none today.
      # Dev-only advisories with no upstream fix (e.g. GHSA-vfj7-8cjw-p6xm in
      # braces, reached via markdownlint-cli2) would otherwise block every PR.
      - name: Run npm audit check (production dependencies)
        run: npm run deps:audit

      # Keep dev-tooling advisories visible without blocking. Revisit when braces is patched.
      - name: Report dev-dependency advisories (non-blocking)
        run: npm audit || true
